# Built-in policy. Use `policygate init` to write it to
# ~/.policygate/config.yaml, or set POLICYGATE_CONFIG to another path.
# Patterns use Go RE2 regular expressions.
config_version: 1
mode: enforce # enforce | observe

# Deny rules apply to the complete command and always take precedence. A deny
# is final, so rules naming a program are anchored to a command position: the
# start of the text or just after a separator. That keeps ordinary text such as
# `git commit -m "halt the retry loop"` from being rejected. Rules are matched
# against the command as written and again with wrappers removed and the
# program name unquoted, so `sudo reboot`, `nice rm -rf /`, and `re'b'oot` are
# all matched at the start of their resolved form.
deny:
  - pattern: '(^|[;&|])\s*(/\S*/)?rm\s+(-\w*r\w*f\w*|-\w*f\w*r\w*)\s+(/|~)(\s|$)'
    reason: "Recursive force-delete of / or $HOME"
  - pattern: ':\(\)\s*\{\s*:\s*\|\s*:\s*&\s*\}\s*;\s*:'
    reason: "Shell fork bomb"
  - pattern: '(^|[;&|])\s*(/\S*/)?dd\b[^|;]*\bof=/dev/(disk|sd|hd|nvme)'
    reason: "Raw write to a block device"
  - pattern: '(^|[;&|])\s*(/\S*/)?mkfs(\.\w+)?\b'
    reason: "Filesystem format command"
  - pattern: '>\s*/dev/(sd|hd|nvme|disk)\w*'
    reason: "Direct write to a block device"
  - pattern: '(^|[;&|])\s*(/\S*/)?(curl|wget)[^|;]*\|\s*(sudo\s+)?(sh|bash|zsh)\b'
    reason: "Piping a network download directly into a shell"
  - pattern: '(^|[;&|])\s*(/\S*/)?chmod\s+-R\s+777\s+/'
    reason: "Recursive world-writable permissions on /"
  - pattern: '(^|[;&|])\s*sudo\s+(-\S+\s+|\w+=\S+\s+)*(/\S*/)?rm\b'
    reason: "Privileged delete"
  - pattern: '>\s*/etc/(passwd|shadow|sudoers)\b'
    reason: "Overwriting a critical system file"
  - pattern: '(^|[;&|])\s*(/\S*/)?(shutdown|reboot|poweroff|halt)\b'
    reason: "Host power state change"
  - pattern: '(^|[;&|])\s*(/\S*/)?(python3?|perl|ruby|sh|bash|zsh)\b[^;\n]*(\.policygate|\.codex/(config\.toml|hooks\.json)|\.claude/settings(\.local)?\.json)'
    reason: "Interpreter-based modification of policygate or hook configuration"

  # PowerShell. These apply everywhere policygate runs, because the dialect is
  # not visible from the tool that carried the command: Codex on Windows reports
  # tool_name "Bash" and sends PowerShell, and Claude Code has a PowerShell tool
  # of its own. None of these patterns has a meaning under a POSIX shell.
  #
  # Matching ignores case throughout, which this section depends on: PowerShell
  # resolves cmdlet and parameter names without regard to it.
  #
  # Deliberately keyed off the target alone, never the switches. PowerShell
  # accepts any unambiguous prefix of a parameter name, and Remove-Item has no
  # other parameter starting with R, so -Recurse can be written -r. A rule that
  # required the switch would be one letter away from useless; a rule that
  # denies naming a drive root or the user profile at all cannot be shortened
  # past. Deleting either is never routine, with or without -Recurse.
  # A drive root has no POSIX reading, so every alias applies here, rm included.
  - pattern: '(^|[;&|(])\s*(remove-item|ri|rm|rd|rmdir|del|erase)\b[^;&|]*[\s''"]+(\$env:userprofile|[a-z]:)[\\/]?([''"]|\s|$)'
    reason: "PowerShell delete targeting a drive root or the user profile"
  # ~ and $HOME are shared syntax, and `rm` reaching them is already handled
  # structurally by the critical-delete check, which reports a better reason.
  # Leaving rm out here keeps that check in charge of the POSIX spelling.
  - pattern: '(^|[;&|(])\s*(remove-item|ri|rd|rmdir|del|erase)\b[^;&|]*[\s''"]+(\$home|~)[\\/]?([''"]|\s|$)'
    reason: "PowerShell delete targeting the user profile"
  - pattern: '(^|[;&|(])\s*(rd|rmdir|del|erase)\b[^;&|]*\s/s\b[^;&|]*[\s''"]+[a-z]:[\\/]?([''"]|\s|$)'
    reason: "cmd.exe recursive delete of a drive root"
  - pattern: '(^|[;&|(])\s*(format-volume|clear-disk|initialize-disk|diskpart)\b'
    reason: "Disk format or repartition"
  - pattern: '(^|[;&|(])\s*(stop-computer|restart-computer)\b'
    reason: "Host power state change"
  # The PowerShell spelling of piping a download straight into a shell.
  - pattern: '(^|[;&|(])\s*(invoke-webrequest|invoke-restmethod|iwr|irm|curl|wget)\b[^;]*\|\s*(invoke-expression|iex)\b'
    reason: "Piping a network download directly into PowerShell"
  - pattern: '(^|[;&|(])\s*(vssadmin|wbadmin)\b[^;&|]*\bdelete\b'
    reason: "Deleting shadow copies or backup catalogs"
  - pattern: '(^|[;&|(])\s*bcdedit\b'
    reason: "Boot configuration change"
  # Enum values accept an unambiguous prefix too: Bypass is the only policy
  # starting with B, and Unrestricted the only one starting with Unr.
  - pattern: '(^|[;&|(])\s*set-executionpolicy\b[^;&|]*\s(byp\w*|b|unr\w*)\b'
    reason: "Disabling the PowerShell execution policy"
  # Matched on the cmdlet, not on which setting it changes. Set-MpPreference
  # takes over a hundred parameters, roughly sixty of them Disable*, and any of
  # them can be abbreviated to its shortest unambiguous prefix: -ExclusionPa
  # reaches ExclusionPath, and ExclusionProcess and HighThreatDefaultAction
  # weaken protection just as effectively. Enumerating the dangerous ones is a
  # race that cannot be won, and reconfiguring Defender is not something a
  # coding assistant has any business doing.
  - pattern: '(^|[;&|(])\s*(set|add|remove)-mppreference\b'
    reason: "Reconfiguring Microsoft Defender"
  - pattern: '(^|[;&|(])\s*reg(\.exe)?\s+delete\b[^;&|]*\bhk(lm|cu|cr|u|cc)\b[^;&|]*\s/f\b'
    reason: "Forced registry deletion"
  - pattern: '(^|[;&|(])\s*(remove-item|ri)\b[^;&|]*\bhk(lm|cu|cr|u|cc):[\\/]?([''"]|\s|$)'
    reason: "Deleting a registry hive root"
  - pattern: '(^|[;&|(])\s*takeown\b[^;&|]*\s/f\s+[a-z]:[\\/]?\s+[^;&|]*/r\b'
    reason: "Recursive ownership seizure of a drive root"
  - pattern: '(^|[;&|(])\s*icacls\b[^;&|]*\s(everyone|users|todos|jeder):[a-z()]*f\b[^;&|]*\s/t\b'
    reason: "Granting full control recursively"
  # An encoded command cannot be analyzed at all, so it is never allowed to
  # stand in for one that could be.
  - pattern: '(^|[;&|(])\s*(powershell(\.exe)?|pwsh(\.exe)?)\b[^;&|]*\s-(e|ec|enc|encoded\w*)\b'
    reason: "Base64-encoded PowerShell command, which cannot be analyzed"
  - pattern: '(^|[;&|(])\s*(powershell(\.exe)?|pwsh(\.exe)?|cmd(\.exe)?)\b[^;\n]*(\.policygate|\.codex[\\/](config\.toml|hooks\.json)|\.claude[\\/]settings(\.local)?\.json)'
    reason: "Interpreter-based modification of policygate or hook configuration"

# Ask rules request explicit host approval for specific commands without
# denying them outright. They are checked the same way deny rules are:
# against the whole command and again against each subcommand's resolved
# form, so quoting cannot hide a matched program name. Empty by default;
# add patterns here (or in a user config) for commands you want to confirm
# on a case-by-case basis, such as specific git or gh write operations.
ask: []

# Allow rules classify familiar low-risk commands for audit purposes. They
# never bypass host approval. Do not add commands that can launch another
# program from their arguments, such as find -exec, xargs, or awk system().
allow:
  - pattern: '^git\s+(status|log|diff|show)\b'
    reason: "Read-only git inspection"
  - pattern: '^(ls|pwd|cat|head|tail|grep|wc)\b'
    reason: "Read-only filesystem inspection"
  - pattern: '^echo\b'
    reason: "Prints to stdout only"

# Inspect refspecs, force markers, deletion, and branch-omitting pushes.
protected_branches:
  names: ["main", "master"]
  block_force_push: true
  block_delete: true
  block_direct_push: false

# Classify supported path arguments as read, write, or delete operations.
path_scope:
  enabled: true
  # Use the hook CWD as the root, or set a fixed absolute path.
  project_root: "cwd"
  outside_project:
    read: "allow"   # allow | ask | deny
    write: "ask"
    delete: "deny"

sensitive_paths:
  enabled: true
  patterns:
    - pattern: '(^|/)\.env(\.[\w.-]+)?$'
      reason: "Environment/secrets file"
    - pattern: '(^|/)\.ssh(/|$)'
      reason: "SSH keys/config"
    - pattern: '(^|/)id_(rsa|ed25519|ecdsa|dsa)(\.pub)?$'
      reason: "SSH private/public key"
    - pattern: '\.(pem|p12|pfx|key)$'
      reason: "Certificate/private key file"
    - pattern: '(^|/)credentials(\.\w+)?$'
      reason: "Credentials file"
    - pattern: '(^|/)\.aws/credentials$'
      reason: "AWS credentials"
    - pattern: '(^|/)\.netrc$'
      reason: "Stored network credentials"
  # Apply regardless of whether the path is inside the project.
  policy:
    read: "ask"
    write: "deny"
    delete: "deny"

# Always deny writes and deletions to matched paths. This is a soft guard: it
# depends on policygate being invoked at all, so pair it with the host's own
# permission model rather than treating it as a boundary. The binary itself is
# guarded structurally, whatever path it is installed to, and needs no entry
# here; run `policygate doctor` to see the paths that covers.
protected_paths:
  enabled: true
  patterns:
    - pattern: '(^|/)\.policygate($|/)'
      reason: "policygate's own config/audit directory"
    - pattern: '(^|/)\.codex/(config\.toml|hooks\.json)$'
      reason: "Codex CLI hook registration"
    - pattern: '(^|/)\.claude/settings(\.local)?\.json$'
      reason: "Claude Code hook registration"

# No AI or LLM fallback is used for unmatched commands.
#
# unanalyzed_action replaces action when the command's dialect has no structural
# analysis behind it, which today means PowerShell. The distinction matters
# because the two look the same and mean opposite things: a POSIX command that
# reaches the fallback was parsed and had its paths classified, so nothing
# applied; a PowerShell command that reaches it was never understood, and only
# the text rules had a chance. `ask` therefore asks about the commands
# policygate cannot vouch for, rather than passing them off as examined.
#
# Codex on Windows sends PowerShell for every command and converts ask to deny,
# so leaving this at ask there rejects ordinary work. Give Codex its own file
# with `policygate install-hook --host codex --config <path>` and set
# unanalyzed_action: defer in it, after reading the limitations.
unknown:
  action: defer # defer | ask | deny
  unanalyzed_action: ask # defer | ask | deny

# Action used when shell syntax cannot be parsed.
parse_error:
  action: defer # defer | ask | deny
  unanalyzed_action: ask # defer | ask | deny

audit:
  enabled: true
  path: "~/.policygate/log/audit.log"
  command_mode: redacted # redacted | full | hash | none
  max_bytes: 10485760
  max_files: 5
